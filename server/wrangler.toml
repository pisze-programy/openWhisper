name = "openwhisper-usage"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Usage analytics counters. Create the namespace first, then paste the id:
#   wrangler kv namespace create USAGE_KV
[[kv_namespaces]]
binding = "USAGE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_NAMESPACE_PREVIEW_ID"

# Daily cleanup of expired aggregates (03:00 UTC).
[triggers]
crons = ["0 3 * * *"]
